<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Jeya Viknan — Software Engineer: automation, applied AI, retrieval systems, full-stack, testing">
  <rect width="1200" height="320" fill="#fbfbfd"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">

    <text x="600" y="118" font-size="13" font-weight="600" letter-spacing="4.5" fill="#86868b">SOFTWARE ENGINEER</text>

    <text x="600" y="200" font-size="82" font-weight="600" letter-spacing="-2.5" fill="#1d1d1f">Jeya Viknan</text>

    <g font-size="26" font-weight="400" letter-spacing="0.2" fill="#6e6e73">

      <g opacity="1">
        <text x="600" y="252">Automation.</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.025;0.175;0.2;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0;0 0;0 -6;0 -6" keyTimes="0;0;0.025;0.175;0.2;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="600" y="252">Applied AI.</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.225;0.375;0.4;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0;0 0;0 -6;0 -6" keyTimes="0;0.2;0.225;0.375;0.4;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="600" y="252">Retrieval systems.</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.425;0.575;0.6;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0;0 0;0 -6;0 -6" keyTimes="0;0.4;0.425;0.575;0.6;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="600" y="252">Full-stack.</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.625;0.775;0.8;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0;0 0;0 -6;0 -6" keyTimes="0;0.6;0.625;0.775;0.8;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="600" y="252">Testing &amp; quality.</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.825;0.975;1;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0;0 0;0 -6;0 -6" keyTimes="0;0.8;0.825;0.975;1;1" dur="12s" repeatCount="indefinite"/>
      </g>

    </g>
  </g>

  <line x1="560" y1="288" x2="640" y2="288" stroke="#d2d2d7" stroke-width="1"/>
</svg>
